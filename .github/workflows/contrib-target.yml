name: contrib-target

# Publishes contribution "target practice" SVGs to the output branch (replaces snake).
on:
  schedule:
    - cron: "22 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1635cc259ebc3b842d394353f5 # v4.2.2

      - name: Build target-practice contribution SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: Rahul-ramakrishnan06
          CONTRIB_OUT: dist
        run: python3 assets/contrib-target.py

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
