name: snake

# Draws the contribution snake shown in README.md and publishes the two SVGs
# to the "output" branch. That branch holds only these files and is replaced
# on every run.
on:
  schedule:
    - cron: "17 0 * * *" # daily, 00:17 UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push to the output branch
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#191B19&color_dots=#F5F4F2,#E8C4C4,#D46A6A,#B83232,#C41E3A
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#E63946

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
