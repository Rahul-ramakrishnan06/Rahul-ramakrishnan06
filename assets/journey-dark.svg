<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" role="img" aria-labelledby="jt jd">
<title id="jt">Career patrol timeline</title>
<desc id="jd">Animated walk through: Student 2018 – 2022; DevOps · VVDN 2022 – 2023; DevOps · SE 2024; Blockchain · Soneium 2024 – 2025; Healthcare · iCliniq 2025 – 2026; Infra Lead · stealth 2026 – now.</desc>
<style>
.runner{animation:runx 14s linear infinite}
@keyframes runx{from{transform:translateX(40px)}to{transform:translateX(854px)}}
.legA{animation:legA .28s steps(1) infinite}.legB{animation:legB .28s steps(1) infinite}
@keyframes legA{50%{opacity:0}}@keyframes legB{0%,50%{opacity:0}50.01%{opacity:1}}
.bob{animation:bob .28s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.lit0{animation:lit0 14s linear infinite}@keyframes lit0{0%,2.4%{opacity:.25}2.5%,100%{opacity:1}}
.lit1{animation:lit1 14s linear infinite}@keyframes lit1{0%,18.7%{opacity:.25}18.8%,100%{opacity:1}}
.lit2{animation:lit2 14s linear infinite}@keyframes lit2{0%,35.1%{opacity:.25}35.2%,100%{opacity:1}}
.lit3{animation:lit3 14s linear infinite}@keyframes lit3{0%,51.5%{opacity:.25}51.6%,100%{opacity:1}}
.lit4{animation:lit4 14s linear infinite}@keyframes lit4{0%,67.9%{opacity:.25}68.0%,100%{opacity:1}}
.lit5{animation:lit5 14s linear infinite}@keyframes lit5{0%,84.3%{opacity:.25}84.4%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.runner,.legA,.legB,.bob,.lit0,.lit1,.lit2,.lit3,.lit4,.lit5{animation:none}}
</style>
